<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alyssa Space - KDP Book Builder</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f0fa;
  color: #30243b;
  padding: 20px;
  margin: 0;
}
main {
  max-width: 480px;
  margin: 30px auto;
  background: white;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 4px 20px #ddd;
}
h1 { color: #754b91; }
label { display:block; margin-top:18px; }
select, input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin-top: 8px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}
button {
  background: #754b91;
  color: white;
  border: 0;
  margin-top: 22px;
}
#result {
  background: #f3eafa;
  padding: 16px;
  margin-top: 20px;
  border-radius: 10px;
  display: none;
}
small { color: #777; }
</style>
</head>
<body>
<main>
<h1>Alyssa Space</h1>
<p>KDP Book Size Calculator</p>

<label>Trim Size</label>
<select id="size">
<option value="5,8">5 × 8 inches</option>
<option value="5.5,8.5">5.5 × 8.5 inches</option>
<option value="6,9" selected>6 × 9 inches</option>
<option value="8,10">8 × 10 inches</option>
<option value="8.5,11">8.5 × 11 inches</option>
</select>

<label>Page Count</label>
<input id="pages" type="number" min="24" value="100">

<label>Interior Bleed</label>
<select id="bleed">
<option value="no">No Bleed</option>
<option value="yes">Bleed</option>
</select>

<button onclick="calculate()">Calculate Size</button>

<div id="result">
<h3>Your PDF Page Size</h3>
<p id="dimensions"></p>
<small>Measurements are in inches.</small>
</div>
</main>

<script>
function calculate() {
  const size = document.getElementById("size").value.split(",");
  const pages = Number(document.getElementById("pages").value);
  const bleed = document.getElementById("bleed").value;

  if (!Number.isInteger(pages) || pages < 24) {
    alert("Enter at least 24 pages.");
    return;
  }

  let width = Number(size[0]);
  let height = Number(size[1]);

  if (bleed === "yes") {
    width += 0.125;
    height += 0.25;
  }

  document.getElementById("dimensions").innerHTML =
    "<b>Width:</b> " + width.toFixed(3) +
    " in<br><b>Height:</b> " + height.toFixed(3) +
    " in<br><b>Pages:</b> " + pages;

  document.getElementById("result").style.display = "block";
}
</script>
</body>
</html>
